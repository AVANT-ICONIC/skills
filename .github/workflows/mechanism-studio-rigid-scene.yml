name: Mechanism Studio generic rigid scene preview
on:
  pull_request:
    paths:
      - 'mechanism-studio/rigid-scene/**'
      - '.github/workflows/mechanism-studio-rigid-scene.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mechanism-rigid-scene-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  rigid_scene:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate data-only scene, both branches and compiler security
        run: |
          set -euo pipefail
          node --test mechanism-studio/rigid-scene/*.test.mjs
          node mechanism-studio/rigid-scene/compile-scene.mjs \
            mechanism-studio/rigid-scene/scene.json "$RUNNER_TEMP/generated/dual-drive-linkage-study-004"
          node mechanism-studio/rigid-scene/compile-scene.mjs \
            mechanism-studio/rigid-scene/slider-rail.json "$RUNNER_TEMP/generated/single-drive-rail-study-005"
          for id in dual-drive-linkage-study-004 single-drive-rail-study-005; do
            test -s "$RUNNER_TEMP/generated/$id/scene-data.mjs"
          done
      - name: Fetch immutable Teardown and validate lock
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --no-checkout https://github.com/elvarofficial/teardown.git "$RUNNER_TEMP/teardown"
          git -C "$RUNNER_TEMP/teardown" checkout --quiet --detach a91262ac1109051e014662d42ecb0b7bc1f113b1
          test "$(git -C "$RUNNER_TEMP/teardown" rev-parse HEAD)" = 'a91262ac1109051e014662d42ecb0b7bc1f113b1'
          echo '39297ac60ef6ae04a93f4716c6bbd6ae48bbd3f116e583d6700274a113012b1e  '"$RUNNER_TEMP/teardown/package-lock.json" | sha256sum -c -
      - name: Install pinned browser/capture stack
        shell: bash
        working-directory: ${{ runner.temp }}/teardown
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install chromium
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Build data-driven scene with pinned Teardown
        shell: bash
        working-directory: ${{ runner.temp }}/teardown
        run: |
          set -euo pipefail
          export TEARDOWN_OUT="$GITHUB_WORKSPACE/.artifacts/rigid-build"
          node sims/build.mjs \
            "$RUNNER_TEMP/generated/dual-drive-linkage-study-004" \
            "$RUNNER_TEMP/generated/single-drive-rail-study-005"
          for id in dual-drive-linkage-study-004 single-drive-rail-study-005; do
            test -s "$TEARDOWN_OUT/dist/$id.html"
          done
      - name: Verify actual Chromium, controls, six frames and 720p24 H264/AAC film
        shell: bash
        run: |
          set -euo pipefail
          for id in dual-drive-linkage-study-004 single-drive-rail-study-005; do
            node mechanism-studio/rigid-scene/verify-scene.mjs \
              "$RUNNER_TEMP/teardown" \
              "$RUNNER_TEMP/generated/$id" \
              "$GITHUB_WORKSPACE/.artifacts/rigid-build" \
              "$GITHUB_WORKSPACE/.artifacts/rigid-evidence/$id"
          done
      - name: Create and independently verify portable scene package
        shell: bash
        run: |
          set -euo pipefail
          for id in dual-drive-linkage-study-004 single-drive-rail-study-005; do
            node mechanism-studio/rigid-scene/package-scene.mjs \
              "$RUNNER_TEMP/teardown" \
              "$RUNNER_TEMP/generated/$id" \
              "$GITHUB_WORKSPACE/.artifacts/rigid-evidence/$id" \
              "$GITHUB_WORKSPACE/.artifacts/rigid-build" \
              "$GITHUB_WORKSPACE/.artifacts/rigid-package/$id"
            node mechanism-studio/rigid-scene/package-scene.mjs --verify \
              "$GITHUB_WORKSPACE/.artifacts/rigid-package/$id"
          done
      - name: Publish original rigid scene viewer, film and source proof
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mechanism-studio-two-topologies-verified
          path: .artifacts/rigid-package/
          if-no-files-found: error
          retention-days: 7
      - name: Preserve diagnostic screenshots and report on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mechanism-studio-rigid-scene-two-topology-evidence
          path: .artifacts/rigid-evidence/
          if-no-files-found: warn
          retention-days: 7
