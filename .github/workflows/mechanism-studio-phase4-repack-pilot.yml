name: Mechanism Studio Phase 4 pilot · sign historical repack (NEVER release)

# The pilot signs a NEW archive of OLD Phase 2 files.
# It is not producer-of-original-films provenance, nor a protected-main release.
on:
  push:
    branches:
      - feat/mechanism-studio-producer-provenance-phase4-20261117
    paths:
      - '.github/workflows/mechanism-studio-phase4-repack-pilot.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mechanism-phase4-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pilot_sign_repack:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/feat/mechanism-studio-producer-provenance-phase4-20261117'
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require patched GitHub CLI before issuance
        run: node mechanism-studio/attestation/gh-cli-policy.mjs
      - name: Retrieve immutable historical package inputs
        uses: actions/download-artifact@v4
        with:
          name: mechanism-studio-two-topologies-verified
          run-id: 43441706721
          github-token: ${{ github.token }}
          path: .pilot-originals
      - name: Prove downloaded manifests match original frozen Phase 2 bytes
        shell: bash
        run: |
          set -euo pipefail
          echo 'da5753a7d59f434c17207310c44d5455bdc28732b86dc0da24c80e92c147921f  .pilot-originals/dual-drive-linkage-study-004/manifest.json' | sha256sum -c -
          echo '7853224957b8c8f971c3444fa5cb4d35742147f01d19d8b316ea0de90bd96467  .pilot-originals/single-drive-rail-study-005/manifest.json' | sha256sum -c -
      - name: Build and verify new TAR from historic verified packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .pilot
          node mechanism-studio/attestation/producer-archive.mjs pack rigid \
            .pilot/producer-rigid.tar \
            .pilot-originals/dual-drive-linkage-study-004 \
            .pilot-originals/single-drive-rail-study-005
          node mechanism-studio/attestation/producer-archive.mjs verify rigid \
            .pilot/producer-rigid.tar
          echo 'df61d95efb02f6051d02f3d727e9ccb5b7b4c1fdde0b33200646ee675a4d3858  .pilot/producer-rigid.tar' | sha256sum -c -
      - name: Issue real Sigstore signature over PILOT archive subject
        uses: actions/attest@v4
        with:
          subject-path: .pilot/producer-rigid.tar
      - name: Publish only signed pilot payload, never a production release
        uses: actions/upload-artifact@v4
        with:
          name: mechanism-studio-phase4-PILOT-historic-repack
          path: .pilot/producer-rigid.tar
          if-no-files-found: error
          retention-days: 7

  pilot_read_only_consumer:
    needs: pilot_sign_repack
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download real signed TAR from SAME pilot run
        uses: actions/download-artifact@v4
        with:
          name: mechanism-studio-phase4-PILOT-historic-repack
          path: .pilot-consumer
      - name: Fresh runner independently rechecks canonical TAR and legacy bytes
        shell: bash
        run: |
          set -euo pipefail
          node mechanism-studio/attestation/gh-cli-policy.mjs
          node mechanism-studio/attestation/producer-archive.mjs verify rigid \
            .pilot-consumer/producer-rigid.tar
      - name: Verify Sigstore with exact PILOT workflow and source identity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh attestation verify .pilot-consumer/producer-rigid.tar \
            --repo AVANT-ICONIC/skills \
            --signer-workflow AVANT-ICONIC/skills/.github/workflows/mechanism-studio-phase4-repack-pilot.yml \
            --source-digest "$GITHUB_SHA" \
            --signer-digest "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF" \
            --deny-self-hosted-runners \
            --predicate-type https://slsa.dev/provenance/v1 \
            --format json > .pilot-consumer/sigstore-verified.json
          test -s .pilot-consumer/sigstore-verified.json
          echo 'PILOT_SIGNATURE_VALID: historical-repack workflow only; production trust NOT established'
      - name: Negative test wrong signer, wrong SHA and altered file
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          T=.pilot-consumer/producer-rigid.tar
          PREFIX='AVANT-ICONIC/skills/.github/workflows/mechanism-studio-phase4-repack-pilot.yml'
          if gh attestation verify "$T" --repo AVANT-ICONIC/skills \
            --signer-workflow "$PREFIX.malicious" --source-digest "$GITHUB_SHA" \
            --signer-digest "$GITHUB_SHA" --source-ref "$GITHUB_REF" >/dev/null 2>&1; then
            echo 'FAIL: lookalike signer accepted'; exit 1
          fi
          if gh attestation verify "$T" --repo AVANT-ICONIC/skills \
            --signer-workflow "$PREFIX" --source-digest "$GITHUB_SHA" \
            --signer-digest 0000000000000000000000000000000000000000 \
            --source-ref "$GITHUB_REF" >/dev/null 2>&1; then
            echo 'FAIL: signer SHA mismatch accepted'; exit 1
          fi
          cp "$T" .pilot-consumer/tampered-rigid.tar
          printf '\\x41' | dd of=.pilot-consumer/tampered-rigid.tar bs=1 seek=600 conv=notrunc status=none
          if gh attestation verify .pilot-consumer/tampered-rigid.tar \
            --repo AVANT-ICONIC/skills --signer-workflow "$PREFIX" \
            --source-digest "$GITHUB_SHA" --signer-digest "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF" >/dev/null 2>&1; then
            echo 'FAIL: altered subject accepted'; exit 1
          fi
          echo 'PASS: lookalike signer, incorrect signer SHA and altered subject all rejected'
