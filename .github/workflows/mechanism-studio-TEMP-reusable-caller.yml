name: Mechanism Studio TEMP reusable signing E2E on historical TAR (never release)

on:
  push:
    branches:
      - feat/mechanism-studio-producer-provenance-phase4-20261117
    paths:
      - '.github/workflows/mechanism-studio-TEMP-reusable-caller.yml'

permissions:
  contents: read

jobs:
  build_historical_repack:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: mechanism-studio-two-topologies-verified
          run-id: 43441706721
          github-token: ${{ github.token }}
          path: .historical
      - name: Verify original historical package bytes and create canonical TAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .original-repack
          echo 'da5753a7d59f434c17207310c44d5455bdc28732b86dc0da24c80e92c147921f  .historical/dual-drive-linkage-study-004/manifest.json' | sha256sum -c -
          echo '7853224957b8c8f971c3444fa5cb4d35742147f01d19d8b316ea0de90bd96467  .historical/single-drive-rail-study-005/manifest.json' | sha256sum -c -
          node mechanism-studio/attestation/producer-archive.mjs pack rigid \
            .original-repack/producer-rigid.tar \
            .historical/dual-drive-linkage-study-004 \
            .historical/single-drive-rail-study-005
          echo 'df61d95efb02f6051d02f3d727e9ccb5b7b4c1fdde0b33200646ee675a4d3858  .original-repack/producer-rigid.tar' | sha256sum -c -
      - uses: actions/upload-artifact@v4
        with:
          name: mechanism-studio-TEMP-reusable-source
          path: .original-repack/producer-rigid.tar
          if-no-files-found: error
          retention-days: 3

  actual_reusable_signer:
    needs: build_historical_repack
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/mechanism-studio-TEMP-reusable-signer.yml
    with:
      source-artifact: mechanism-studio-TEMP-reusable-source

  independent_read_only_consumer:
    needs: actual_reusable_signer
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: mechanism-studio-TEMP-reusable-signed
          path: .signed-reusable
      - name: Read-only cryptographic verification with PINNED reusable signer identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node mechanism-studio/attestation/gh-cli-policy.mjs
          node mechanism-studio/attestation/producer-archive.mjs verify rigid .signed-reusable/producer-rigid.tar
          gh attestation verify .signed-reusable/producer-rigid.tar \
            --repo AVANT-ICONIC/skills \
            --signer-workflow AVANT-ICONIC/skills/.github/workflows/mechanism-studio-TEMP-reusable-signer.yml \
            --signer-digest "$GITHUB_SHA" --source-digest "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF" --deny-self-hosted-runners \
            --predicate-type https://slsa.dev/provenance/v1 \
            --format json > .signed-reusable/verified.json
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import {assertVerifiedProducerAttestationResult as inspect} from './mechanism-studio/attestation/producer-provenance-result.mjs';
          const data=JSON.parse(readFileSync('.signed-reusable/verified.json','utf8'));
          const expected={
           subjectSha256:'df61d95efb02f6051d02f3d727e9ccb5b7b4c1fdde0b33200646ee675a4d3858',
           sourceCommit:process.env.GITHUB_SHA,
           signerCommit:process.env.GITHUB_SHA,
           sourceRef:process.env.GITHUB_REF,
           signerWorkflowUri:'https://github.com/AVANT-ICONIC/skills/.github/workflows/mechanism-studio-TEMP-reusable-signer.yml',
           buildTrigger:'push'
          };
          const cert=data?.[0]?.verificationResult?.signature?.certificate;
          console.log('REUSABLE_SIGNER_CERT_FIELDS',JSON.stringify({
           buildSignerURI:cert?.buildSignerURI,buildSignerDigest:cert?.buildSignerDigest,
           sourceRepositoryDigest:cert?.sourceRepositoryDigest,sourceRepositoryRef:cert?.sourceRepositoryRef,
           githubWorkflowSHA:cert?.githubWorkflowSHA,githubWorkflowRef:cert?.githubWorkflowRef,
           buildTrigger:cert?.buildTrigger
          }));
          const success=inspect(data,expected);
          if(success.result!=='MATCHED'||success.releaseReady!==false)throw Error('REUSABLE_PILOT_NOT_MATCHED');
          console.log('PASS: ACTUAL reusable signer and signed certificate agree with independent exact identities');
          NODE
      - name: Reject production promotion of correctly signed reusable PILOT
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          set +e
          result=$(node mechanism-studio/attestation/verify-signed-producer.mjs \
            rigid .signed-reusable/producer-rigid.tar "$GITHUB_SHA" "$GITHUB_SHA" 2>&1)
          status=$?
          set -e
          if [[ "$status" == 0 ]]; then
            echo 'FAIL: unprotected reusable pilot accepted for protected-main production'; exit 1
          fi
          grep -q 'PRODUCER_ATTESTATION_CRYPTOGRAPHIC_VERIFICATION_FAILED' <<< "$result" || {
            echo "$result"; echo 'FAIL: wrong trust boundary'; exit 1;
          }
          echo 'PASS: production policy rejects correct reusable PILOT signature'
