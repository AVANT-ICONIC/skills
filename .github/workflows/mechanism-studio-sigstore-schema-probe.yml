name: Mechanism Studio signer JSON read-only schema probe (temporary)

on:
  push:
    branches:
      - feat/mechanism-studio-producer-provenance-phase4-20261117
    paths:
      - '.github/workflows/mechanism-studio-sigstore-schema-probe.yml'

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require patched gh
        run: node mechanism-studio/attestation/gh-cli-policy.mjs
      - name: Fetch previously signed real rigid TAR
        uses: actions/download-artifact@v4
        with:
          name: mechanism-studio-phase4-PILOT-historic-repack
          run-id: 44112576203
          github-token: ${{ github.token }}
          path: .signed
      - name: Prove actual signer JSON format with true cryptographic validation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo 'df61d95efb02f6051d02f3d727e9ccb5b7b4c1fdde0b33200646ee675a4d3858  .signed/producer-rigid.tar' | sha256sum -c -
          gh attestation verify .signed/producer-rigid.tar \
            --repo AVANT-ICONIC/skills \
            --signer-workflow AVANT-ICONIC/skills/.github/workflows/mechanism-studio-phase4-repack-pilot.yml \
            --source-digest 56fcc1e8f8a264782d8ba07ebd1101e051361d3b \
            --signer-digest 56fcc1e8f8a264782d8ba07ebd1101e051361d3b \
            --source-ref refs/heads/feat/mechanism-studio-producer-provenance-phase4-20261117 \
            --deny-self-hosted-runners \
            --predicate-type https://slsa.dev/provenance/v1 \
            --format json > .signed/verified.json
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import {assertVerifiedProducerAttestationResult as inspect} from './mechanism-studio/attestation/producer-provenance-result.mjs';
          const data=JSON.parse(readFileSync('.signed/verified.json','utf8'));
          if(!Array.isArray(data)||!data.length)throw Error('EXPECTED_ARRAY_OF_RESULTS');
          const v=data[0].verificationResult;
          console.log('GH_VERIFIED_SCHEMA',JSON.stringify({
            count:data.length,
            topKeys:Object.keys(data[0]),
            resultKeys:Object.keys(v??{}),
            identityKeys:Object.keys(v?.verifiedIdentity??{}),
            identityValues:v?.verifiedIdentity,
            certificateKeys:Object.keys(v?.signature?.certificate??{}),
            certificateSelect:Object.fromEntries(['subjectAlternativeName','githubWorkflowSHA','githubWorkflowRef','buildSignerURI','buildSignerDigest','runnerEnvironment','sourceRepositoryDigest','sourceRepositoryRef','sourceRepositoryURI','githubWorkflowRepository','buildTrigger'].map(k=>[k,v?.signature?.certificate?.[k]])),
            predicateKeys:Object.keys(v?.statement?.predicate??{}),
            signatureKeys:Object.keys(v?.signature??{}),
            hasCertificate:!!v?.signature?.certificate,
            timestampIsArray:Array.isArray(v?.verifiedTimestamps),
            timestampCount:v?.verifiedTimestamps?.length??0,
            statementKeys:Object.keys(v?.statement??{}),
            predicateType:v?.statement?.predicateType,
            subjectSha:v?.statement?.subject?.[0]?.digest?.sha256
          }));
          if(v?.statement?.subject?.[0]?.digest?.sha256!=='df61d95efb02f6051d02f3d727e9ccb5b7b4c1fdde0b33200646ee675a4d3858')
            throw Error('SUBJECT_DIGEST_MISSING');
          const expected={
            subjectSha256:'df61d95efb02f6051d02f3d727e9ccb5b7b4c1fdde0b33200646ee675a4d3858',
            sourceCommit:'56fcc1e8f8a264782d8ba07ebd1101e051361d3b',
            signerCommit:'56fcc1e8f8a264782d8ba07ebd1101e051361d3b',
            sourceRef:'refs/heads/feat/mechanism-studio-producer-provenance-phase4-20261117',
            signerWorkflowUri:'https://github.com/AVANT-ICONIC/skills/.github/workflows/mechanism-studio-phase4-repack-pilot.yml',
            buildTrigger:'push'
          };
          const accepted=inspect(data,expected);
          if(accepted.result!=='MATCHED'||accepted.releaseReady!==false)throw Error('PILOT_CLAIMS_NOT_ACCEPTED');
          console.log('REAL_SIGSTORE_CLAIMS_CHECK PASS: certificate/source/signer/runner/subject match, no release permission');
          const tampered=structuredClone(data);
          tampered[0].verificationResult.signature.certificate.buildSignerDigest='0'.repeat(40);
          try{inspect(tampered,expected);throw Error('ALTERED_SIGNER_CLAIMS_ACCEPTED');}
          catch(e){if(e.message==='ALTERED_SIGNER_CLAIMS_ACCEPTED')throw e;}
          console.log('REAL_SIGSTORE_MUTATED_CLAIMS_REJECTED PASS');

          NODE
