name: Mechanism Studio original Geneva model
on:
  pull_request:
    paths:
      - 'mechanism-studio/examples/geneva-indexer/**'
      - '.github/workflows/mechanism-studio-geneva.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  geneva-original:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify independent Geneva kinematics
        run: node --test mechanism-studio/examples/geneva-indexer/model.test.mjs
      - name: Fetch immutable upstream revision
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --no-checkout https://github.com/elvarofficial/teardown.git "$RUNNER_TEMP/teardown"
          git -C "$RUNNER_TEMP/teardown" checkout --quiet --detach a91262ac1109051e014662d42ecb0b7bc1f113b1
          test "$(git -C "$RUNNER_TEMP/teardown" rev-parse HEAD)" = 'a91262ac1109051e014662d42ecb0b7bc1f113b1'
          echo '39297ac60ef6ae04a93f4716c6bbd6ae48bbd3f116e583d6700274a113012b1e  '"$RUNNER_TEMP/teardown/package-lock.json" | sha256sum -c -
      - name: Install pinned renderer dependencies
        working-directory: ${{ runner.temp }}/teardown
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install chromium
      - name: Install FFmpeg explicitly
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Build standalone original machine through pinned Teardown
        working-directory: ${{ runner.temp }}/teardown
        shell: bash
        run: |
          set -euo pipefail
          export TEARDOWN_OUT="$GITHUB_WORKSPACE/.artifacts/geneva"
          node sims/build.mjs "$GITHUB_WORKSPACE/mechanism-studio/examples/geneva-indexer"
          test -s "$TEARDOWN_OUT/dist/geneva-indexer.html"
      - name: Inspect live 3D, arbitrary seek, controls, encoded film
        shell: bash
        run: |
          set -euo pipefail
          node mechanism-studio/examples/geneva-indexer/smoke.mjs \
            "$RUNNER_TEMP/teardown" "$GITHUB_WORKSPACE/.artifacts/geneva"
      - name: Package original viewer film and evidence (preview only)
        shell: bash
        run: |
          set -euo pipefail
          node mechanism-studio/examples/geneva-indexer/package.mjs \
            "$RUNNER_TEMP/teardown" "$GITHUB_WORKSPACE/.artifacts/geneva" \
            "$GITHUB_WORKSPACE/.artifacts/geneva-package"
          node mechanism-studio/scripts/verify.mjs "$GITHUB_WORKSPACE/.artifacts/geneva-package"
      - name: Preserve portable verified original package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mechanism-studio-original-geneva-package
          path: .artifacts/geneva-package/
          if-no-files-found: error
          retention-days: 7
      - name: Preserve actual generated HTML, frames, MP4 and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mechanism-studio-original-geneva-evidence
          path: .artifacts/geneva/
          if-no-files-found: warn
          retention-days: 7
