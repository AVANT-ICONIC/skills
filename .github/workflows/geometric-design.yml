name: Geometric Design portable skill QA
on:
  pull_request:
    paths:
      - 'geometric-design/**'
      - '.github/workflows/geometric-design.yml'
  push:
    branches: [main]
    paths:
      - 'geometric-design/**'
      - '.github/workflows/geometric-design.yml'
permissions:
  contents: read
jobs:
  node-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Standalone source and real CLI smoke tests
        run: node --test geometric-design/tests/*.test.mjs
      - name: Reject accidental private metadata and paid runtime packages
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import re,sys
          p=Path('geometric-design')
          offenders=[]
          patterns=[r'agent[-]workbench',r'PRIV[A]TE_FIXTURE',r'GH[-]0[1-5]',r'-----BEGIN (?:RSA |OPENSSH )?PRIVATE KEY',r'\bsk-[a-zA-Z0-9_-]{20,}\b']
          for f in p.rglob('*'):
            if not f.is_file() or f.is_symlink(): continue
            if f.stat().st_size>200000: offenders.append(f'{f}:too large'); continue
            data=f.read_text('utf8')
            if any(re.search(q,data,re.I) for q in patterns):offenders.append(str(f))
          assert not offenders, f'Blocked public content: {offenders}'
          print('Public privacy marker preflight PASS')
          PYCODE
