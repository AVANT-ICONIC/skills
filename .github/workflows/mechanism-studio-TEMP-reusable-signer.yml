name: Mechanism Studio TEMPORARY reusable Sigstore signer PILOT (not release)

on:
  workflow_call:
    inputs:
      source-artifact:
        type: string
        required: true

jobs:
  sign_pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - name: Refuse non-PILOT events or protected main
        shell: bash
        env:
          SOURCE: ${{ inputs['source-artifact'] }}
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
          PROTECTED: ${{ github.ref_protected }}
        run: |
          set -euo pipefail
          [[ "$SOURCE" == 'mechanism-studio-TEMP-reusable-source' ]] || exit 1
          [[ "$EVENT" == push ]] || exit 1
          [[ "$REF_NAME" == 'refs/heads/feat/mechanism-studio-producer-provenance-phase4-20261117' ]] || exit 1
          [[ "$PROTECTED" != true ]] || exit 1
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check patched gh version
        run: node mechanism-studio/attestation/gh-cli-policy.mjs
      - name: Download exact producer archive from same run
        uses: actions/download-artifact@v4
        with:
          name: mechanism-studio-TEMP-reusable-source
          path: .pilot-signer
      - name: Verify TAR canonical bytes and original v1 packages
        shell: bash
        run: |
          set -euo pipefail
          node mechanism-studio/attestation/producer-archive.mjs verify rigid .pilot-signer/producer-rigid.tar
          echo 'df61d95efb02f6051d02f3d727e9ccb5b7b4c1fdde0b33200646ee675a4d3858  .pilot-signer/producer-rigid.tar' | sha256sum -c -
      - name: Sign TEMPORARY PILOT TAR in actual reusable workflow
        uses: actions/attest@v4
        with:
          subject-path: .pilot-signer/producer-rigid.tar
      - name: Upload signed pilot TAR (not certified original build)
        uses: actions/upload-artifact@v4
        with:
          name: mechanism-studio-TEMP-reusable-signed
          path: .pilot-signer/producer-rigid.tar
          if-no-files-found: error
          retention-days: 7
